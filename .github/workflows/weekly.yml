# Rebuilds the boards every Monday at 13:00 UTC (after the Sunday-night UFCStats refresh) and again on
# Friday for late card changes, commits the outputs, and locks pre-event picks (predictions/picks.csv).
name: weekly-boards
on:
  schedule:
    - cron: "0 13 * * 1"   # Monday: new results in, boards rebuilt, picks locked for the next card
    - cron: "0 13 * * 5"   # Friday: late-notice bouts and replacements get a pick before the weekend card
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Check every import resolves before the rebuild
        run: PYTHONPATH=src python -c "import mmalab.run_all, tabulate, markdown"
      - name: Run the fast test suite before the rebuild
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q -m "not slow"
      - run: bash scripts/refresh_data.sh --quick
      - name: Sanity checks before anything is committed
        # Fails the job (and so publishes nothing) if a board is malformed, a committed snapshot changed, a locked pick
        # was edited, the data shrank, or the site has a dead link. See src/mmalab/checks.py.
        run: PYTHONPATH=src python -m mmalab.checks --ref HEAD
      - name: Commit outputs
        run: |
          git config user.name "real-fighter-rankings bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          summary=$(PYTHONPATH=src python -c "import json,pandas as pd;b=pd.read_csv('data/processed/bouts.csv');s=json.load(open('outputs/picks_summary.json'));print(f\"bouts {len(b)} through {b['date'].max()}; picks graded {s.get('graded',0)}, pending {s.get('pending',0)}, no pick {s.get('no_pick',0)}; feed ok {s.get('feed_status',{}).get('ok','?')}\")" 2>/dev/null || echo "summary unavailable")
          git commit -m "Weekly rebuild $(date -u +%F)" -m "$summary" || echo "nothing to commit"
          git push
