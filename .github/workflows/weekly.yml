# Rebuilds the boards every Monday at 13:00 UTC (after the Sunday-night UFCStats refresh) and again on
# Friday for late card changes, commits the outputs, and locks pre-event picks (predictions/picks.csv).
name: weekly-boards
on:
  schedule:
    - cron: "0 13 * * 1"   # Monday: new results in, boards rebuilt, picks locked for the next card
    - cron: "0 13 * * 5"   # Friday: late-notice bouts and replacements get a pick before the weekend card
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Check every import resolves before the rebuild
        run: PYTHONPATH=src python -c "import mmalab.run_all, tabulate, markdown"
      - run: bash scripts/refresh_data.sh --quick
      - name: Commit outputs
        run: |
          git config user.name "real-fighter-rankings bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Weekly rebuild $(date -u +%F)" || echo "nothing to commit"
          git push
