# Same-name fighters on UFCStats (data finding D8).
#
# UFCStats gives a few distinct fighters (different fighter-details URLs) the same display name, and
# the bout files (ufc_fight_results.csv, ufc_fight_stats.csv) carry only that name, so without this
# file ingest.py merges two careers into one: the flyweight Bruno "Bulldog" Silva and the middleweight
# Bruno "Blindado" Silva were one 23-bout "Bruno Silva" on the boards.
#
# src/mmalab/ingest.py reads this file. For every shared name it lists each fighter URL with the
# processed display name and the evidence that assigns bouts to him:
#   url         the UFCStats fighter page (the identity). The URLs under a name must be exactly the
#               pages that carry that name in ufc_fighter_tott.csv / ufc_fighter_details.csv.
#   name        the display name written to bouts.csv, round_stats.csv and fighters.csv. The fighter
#               with the larger UFC footprint keeps the plain name (more UFC bouts; ties go to the more
#               recent or the ranked fighter); each other one gets a suffix in parentheses, the UFCStats
#               nickname when there is one, else the birth year, else the listed weight, else the start
#               of the UFCStats fighter id. Exactly one entry per name keeps the plain name.
#   divisions   bouts of the shared name in these divisions belong to this fighter. The lists of one
#               name's entries must not overlap. Empty means the fighter has no UFC bouts yet.
#   bout_urls   optional explicit assignments (ufcstats.com/fight-details/...) that win over divisions,
#               for a catch weight or a bout in a division both fighters have used.
#   nickname, dob, weight_lb, ufc_bouts, reason   documentation for the reviewer, not read by code.
# A bout of a shared name that no entry claims stops ingest with an error that names the bout, as does a
# shared name in the fighter files that is missing here, an entry whose URLs no longer match the files,
# or a suffixed name that already belongs to another fighter, so a refresh cannot silently merge careers
# again. Downstream, config/official_rank_aliases.yaml and the hand-kept roster files refer to the plain
# name, so the plain name must stay with the fighter they mean (Bruno Gustavo da Silva is the flyweight).
# Assignments were checked against the bout division, the fighters' listed weights and birth dates, and
# press coverage of the two 2026 debuts (ufcstats.com is not reachable from the build sandbox):
# cagesidepress.com and heavy.com, 2026-10-03, for Anthony Romero (Up Next Fighting bantamweight champion
# from the California circuit, moved up to featherweight on short notice); cagesidepress.com and
# bolavip.com, 2026-04-25, for Victor Valenzuela (the Chilean "Sikosis", a 2025 Contender Series loser).
# Bout counts are as of the 2026-10-17 data.

