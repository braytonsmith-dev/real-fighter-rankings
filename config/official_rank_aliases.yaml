# Official UFC ranking-history name -> UFCStats name (the spelling used in data/processed/bouts.csv).
# src/mmalab/official_ranks.py applies these before its normalised and fuzzy matching, so a ranked
# fighter whose two sources spell the name differently still gets an official rank at fight time.
# Every target must appear in bouts.csv; the loader raises ValueError if one does not, so a renamed
# UFCStats fighter cannot silently fall back to unranked. Each line says how the identity was confirmed
# (ranking-history divisions and dates checked against the UFCStats bouts under the target name).
Antonio Rogerio Nogueira: Rogerio Nogueira       # ranked LHW 2013-2018; UFCStats "Rogerio Nogueira" has 13 LHW bouts 2009-2020 (Lil Nog; his twin Antonio Rodrigo is the HW)
Bruno Gustavo da Silva: Bruno Silva              # ranked Flyweight 2023-2026; UFCStats "Bruno Silva" (125 lb, fighter-details/294aa73dbf37d281) has his Flyweight bouts 2020-2026. The middleweight Bruno "Blindado" Silva is "Bruno Silva (Blindado)" in bouts.csv (config/fighter_disambiguation.yaml), so this alias reaches only the flyweight
Costas Philippou: Constantinos Philippou         # ranked MW 2013-2015; UFCStats "Constantinos Philippou" has 10 MW bouts 2011-2015 (Costas is the short form)
Cris Cyborg: Cristiane Justino                   # ranked WFW champion 2017-2018; UFCStats "Cristiane Justino" has her 7 UFC bouts 2016-2019 incl. the Nunes title loss on 2018-12-29
Francisco Rivera Jr.: Francisco Rivera           # ranked BW 2013-2016; UFCStats "Francisco Rivera" has 11 BW bouts 2011-2016 (the "Jr." suffix breaks the token-count fuzzy rule)
Luis Henrique Barbosa: Luis Henrique             # ranked HW #15 in the 2017-01-02 release; UFCStats "Luis Henrique" (Luis Henrique Barbosa de Oliveira, KLB) has 6 HW/LHW bouts 2015-2018 from the Ngannou debut on
Magomed Bibulatov: Bibulatov Magomed             # ranked Flyweight 2017-2019; UFCStats lists him surname first, "Bibulatov Magomed", 3 Flyweight bouts 2017-2019
Mara Borella: Mara Romero Borella                # ranked WFLW 2017-2020; UFCStats "Mara Romero Borella" has 7 WFLW bouts 2017-2020
Ronaldo Souza: Jacare Souza                      # ranked MW/LHW 2013-2020; UFCStats uses the nickname "Jacare Souza", 16 MW/LHW bouts 2013-2021
Tim Johnson: Timothy Johnson                     # ranked HW 2016-2018; UFCStats "Timothy Johnson" has 7 HW bouts 2015-2018 (the only Johnson at HW in that span)
Ulka Sasaki: Yuta Sasaki                         # ranked Flyweight 2017-2018; UFCStats "Yuta Sasaki" has 9 BW/Flyweight bouts 2014-2018 (Ulka is his ring name)
