# Champions that bout data cannot see (title promotions, vacated belts).
# The rankings module derives each champion from the last undisputed title
# bout; entries here override that. VACANT removes the champion row.
# Every entry needs 'since YYYY-MM-DD' (the date it took effect). An undisputed title
# bout in the data after that date supersedes the entry automatically, and the build
# prints a reminder to delete it.
# Keep the reason so the file audits itself.
Heavyweight: Ciryl Gane since 2026-09-20   # interim champ promoted after Aspinall vacated Sept 14, 2026; Dana White, UFC 331 presser Sept 20; first defense vs Josh Hokit at UFC 334 (https://khelnow.com/ufc/has-ciryl-gane-been-promoted-to-heavyweight-champion-ahead-of-ufc-334-202609; ufc.com/rankings lists him as Champion)
