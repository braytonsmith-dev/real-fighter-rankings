# Fighters removed from the boards because they are no longer on the UFC roster (released or retired).
# UFCStats has no roster field, so these are entered by hand, with the date each one took effect, and a
# historical rebuild only removes a fighter for the dates he was actually gone.
#
# Format: one entry per line. Every entry needs `since` and `source`.
# - {fighter: "Name as on UFCStats", since: YYYY-MM-DD, until: YYYY-MM-DD or null, reason: "released/retired ...", source: "url or publication"}
#   since   first board date the fighter is off the roster. A board built for date D holds the bouts before D
#           only, so a retirement announced in the cage on fight night D takes effect on D + 1 (the fighter was
#           still active when that night's board was drawn); a release announced on a non-fight day takes effect
#           that day.
#   until   null while he stays gone; if he comes back, the date the return was announced. Keep the entry: it
#           records that he was off the roster between the two dates (see Niko Price).
# An entry applies to a board built for date D when since <= D and (until is null or D < until).
# The old undated form `Name: reason` still loads but is applied to every date; the build prints a note.
- {fighter: "Jailton Almeida", since: 2026-02-11, until: null, reason: "released Feb 11, 2026 after the loss to Rizvan Kuniev (Feb 7); signed with ACA", source: "https://cagesidepress.com/2026/02/11/jailton-almeida-released-by-ufc-following-loss-to-rizvan-kuniev-at-ufc-vegas-113"}
