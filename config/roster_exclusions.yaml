# Fighters removed from the boards because they are no longer on the UFC roster.
# UFCStats has no roster field, so releases and retirements are entered here by hand.
# Format: UFCStats name: reason and date, with a source.
Jailton Almeida: released Feb 11, 2026 after loss to Rizvan Kuniev; signed with ACA (cagesidepress.com/2026/02/11)
Dustin Poirier: retired after UFC 318 vs Max Holloway, July 19, 2025 (announced retirement fight)
