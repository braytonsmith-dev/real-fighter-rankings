Court McGee: retired after KO loss to Eric Nolan at UFC 332, Oct 3, 2026 (https://www.si.com/fannation/mma/news/25-fight-ufc-veteran-confirms-retirement-after-knockout-loss-at-ufc-332)
Gerald Meerschaert: retired in the cage after TKO loss to Julius Walker at UFC Vegas 122, Oct 10, 2026 (https://www.mmanews.com/article/gerald-meerschaert-retires-ufc-vegas-122-60-fights)
# Niko Price removed Oct 12, 2026: returned from his Mar 2026 retirement and beat Leon Shahbazyan Oct 10, 2026, then walked back retiring again (https://www.rotowire.com/mma/player/niko-price-1044)
